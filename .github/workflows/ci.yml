name: CI

on:
    push:
        branches: [development, main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            # .npmrc já define legacy-peer-deps=true.
            - name: Install dependencies
              run: npm ci

            # typedRoutes: os tipos das rotas (.expo/types/router.d.ts) são
            # gerados pelo `expo start` e ficam fora do git. Sem eles,
            # useSegments() perde os tipos e o tsc falha em app/_layout.tsx.
            - name: Generate Expo Router types
              run: npx expo customize tsconfig.json

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npx expo lint
